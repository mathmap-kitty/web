<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>十一單元｜486題正式題庫總覽</title>
  <link rel="stylesheet" href="../app/vendor/katex/katex.min.css">
  <style>
    :root{--navy:#17365d;--blue:#2468a2;--pale:#eaf3fb;--ink:#172033;--muted:#5d6876;--line:#d7dfeb;--bg:#f4f7fa;--ok:#16784a;--okbg:#eaf8f1}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7}header{padding:30px 18px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.inner,main{width:min(1120px,calc(100% - 28px));margin:auto;min-width:0}.eyebrow{font-weight:900;letter-spacing:.08em;opacity:.9}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;margin:.2em 0}.status{display:inline-block;margin-top:10px;padding:7px 13px;border-radius:999px;background:#fff;color:var(--navy);font-weight:900}nav{position:sticky;top:0;z-index:6;background:#ffffffed;border-bottom:1px solid var(--line)}nav .inner{display:flex;gap:9px;align-items:center;padding:9px 0;overflow-x:auto}nav .inner>*{flex:0 0 auto}select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff}button{cursor:pointer;font-weight:900;color:var(--navy)}main{padding:20px 0 70px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric,.summary,.question{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 3px 14px #1720330c}.metric strong{display:block;color:var(--blue);font-size:1.7rem}.metric span,.muted{color:var(--muted)}.summary,.question{margin-top:15px}.question{scroll-margin-top:76px}.qtop{display:flex;justify-content:space-between;gap:12px}.qid{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--pale);color:var(--navy);font-weight:900}.qtop h2{margin:.45em 0}.stage{min-width:max-content;height:max-content;padding:6px 10px;border-radius:999px;background:var(--blue);color:#fff;font-weight:900}.stem{font-size:1.08rem;font-weight:750;padding:14px 16px;background:#fbfcff;border:1px solid var(--line);border-radius:12px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;list-style:none;padding:0}.options li{border:1px solid var(--line);border-radius:10px;padding:10px}.options .correct{background:var(--okbg);border-color:#9dd1b4}.option-id{display:inline-grid;place-items:center;width:1.7em;height:1.7em;margin-right:6px;border-radius:50%;background:var(--pale);color:var(--navy);font-weight:900}.correct .option-id{background:var(--ok);color:#fff}details{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:10px}summary{cursor:pointer;color:var(--navy);font-weight:900}.solution{padding:11px;background:#fbfcff;border-radius:8px}.katex-display,.solution{max-width:100%;overflow-x:auto;overflow-y:hidden}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.meta span{padding:3px 8px;border:1px solid var(--line);border-radius:999px}.hidden{display:none!important}.error{padding:16px;border-left:6px solid #a32626;background:#fff0f0;color:#7a1b1b}.back{color:#fff}.print{background:var(--blue);color:#fff;border:0}@media(max-width:850px){.metrics{grid-template-columns:repeat(3,1fr)}.options{grid-template-columns:1fr}}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.qtop{display:block}.stage{display:inline-block}.metric,.summary,.question{padding:16px}}@media print{nav{display:none}body{background:#fff}.metric,.summary,.question{box-shadow:none;break-inside:avoid}details{display:block}details>*{display:block}}
  </style>
</head>
<body>
  <header><div class="inner"><div class="eyebrow">複習後診斷系統｜教師閱讀版</div><h1>十一單元486題正式題庫</h1><p>完整呈現每題題幹、選項、正確答案、解析、施測時點與知識點。</p><span class="status">十一單元均已通過審查並正式出版</span><p><a class="back" href="expansion/matrix-full-question-bank-review.html">← 返回矩陣題庫頁</a></p></div></header>
  <nav><div class="inner"><label>單元 <select id="unit"><option value="ALL">全部十一單元</option></select></label><label>時點 <select id="purpose"><option value="ALL">全部時點</option><option value="INITIAL">初診</option><option value="IMMEDIATE_VARIANT">立即變式</option><option value="DELAYED_RETEST">延後確認</option></select></label><label>能力 <select id="ability"><option value="ALL">全部能力</option><option value="CONCEPT">概念理解</option><option value="RECOGNITION">線索辨識</option><option value="APPLICATION">應用遷移</option></select></label><button id="expand">展開目前解析</button><button id="collapse">收合解析</button><button class="print" onclick="window.print()">列印／另存 PDF</button><strong id="count">載入中…</strong></div></nav>
  <main><section id="metrics" class="metrics"></section><section class="summary"><h2>閱讀方式</h2><p>上方可選擇單元、施測時點或能力。綠底選項是正確答案；按「展開答案與解析」即可閱讀詳解。</p><p class="muted">本頁直接讀取十一份正式題庫，不使用舊審查快照，因此題數會與本機診斷系統一致。</p></section><section id="questions" aria-live="polite"><p>正在載入十一單元正式題庫……</p></section></main>
  <script src="../app/vendor/katex/katex.min.js"></script>
  <script>
    const units={poly:{name:'多項式',count:45,kp:['除法、餘式與因式定理','二次函數：判別式與配方','多項式方程式與不等式','高次方程式','三次函數圖形與對稱中心']},linecir:{name:'直線與圓',count:45,kp:['直線方程式與斜率','兩點距離與三角形','圓方程式','直線與圓的位置','平面區域與線性規劃']},seq:{name:'數列與級數',count:36,kp:['等差數列','等比數列','遞迴數列','級數求和與規律週期']},comb:{name:'排列組合',count:36,kp:['計數原理與系統列舉','排列與位置限制','組合、重複組合與分組','分類計數與結果等價']},probability:{name:'機率',count:36,kp:['樣本空間與古典機率','事件運算、餘事件與獨立','條件機率、全機率與貝氏','隨機變數與期望值']},data:{name:'數據分析',count:36,kp:['一維數據與標準差','相關係數','迴歸直線（最適直線）','加權平均與資料判讀']},explog:{name:'指數與對數',count:45,kp:['指數律與指數方程','對數的定義與運算','常用對數（科學記號、位數）','指數對數函數圖形','應用模型與數列結合']},trig:{name:'三角比與三角函數',count:63,kp:['三角比、弧度與廣義角','正弦定理、餘弦定理','三角測量與幾何應用','三角函數圖形','和差角、倍角','角平分線、面積比與相似','圓周角與二面角中的三角']},pvec:{name:'平面向量',count:45,kp:['向量的表示與運算','線性組合、分點與面積比','內積：夾角、垂直、正射影','行列式與平行四邊形面積','向量的旋轉與坐標應用']}};
    units.space={name:'空間向量',count:54,kp:['空間坐標、距離與正立方體','內積、夾角與垂直','外積、面積與體積','平面方程式、投影與點到平面距離','空間直線、軌跡與歪斜線','二面角與立體']};
    units.matrix={name:'矩陣',count:45,kp:['矩陣的意義、相等與乘法','矩陣的高次方','反方陣與解矩陣方程式','一次聯立與高斯消去','平面線性變換']};
    const abilityNames={CONCEPT:'概念理解',RECOGNITION:'線索辨識',APPLICATION:'應用遷移'};
    const purposeNames={INITIAL:'初診',INITIAL_DIAGNOSIS:'初診',IMMEDIATE_VARIANT:'立即變式',DELAYED_RETEST:'延後確認'};
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function tex(source){try{return katex.renderToString(String(source),{throwOnError:true,strict:'ignore',output:'htmlAndMathml'});}catch{return `<span>${esc(source)}</span>`}}
    function math(value){const text=String(value??'');let out='',pos=0;const pattern=/\[\[([\s\S]*?)\]\]|\\\(([\s\S]*?)\\\)|\\\[([\s\S]*?)\\\]/g;for(const match of text.matchAll(pattern)){out+=esc(text.slice(pos,match.index));out+=tex(match[1]??match[2]??match[3]);pos=match.index+match[0].length}if(pos)return out+esc(text.slice(pos));pos=0;out='';for(const match of text.matchAll(/[A-Za-z0-9][A-Za-z0-9_()=+\-*/^⋯≠≤≥<>∣·,]*/g)){out+=esc(text.slice(pos,match.index));out+=tex(match[0]);pos=match.index+match[0].length}return out+esc(text.slice(pos))}
    function normalizedPurpose(value){return value==='INITIAL_DIAGNOSIS'?'INITIAL':value}
    function kpName(item){const n=Number(String(item.primaryConceptId).match(/kp(\d+)/)?.[1]);return units[item.unitId].kp[n-1]||item.primaryConceptId}
    function card(item,index){const correct=new Set(item.answerSpec?.correctOptionIds||[]),purpose=normalizedPurpose(item.purpose);return `<article class="question" data-unit="${item.unitId}" data-purpose="${purpose}" data-ability="${item.ability}"><div class="qtop"><div><span class="qid">${index+1}. ${esc(units[item.unitId].name)}｜${esc(item.primaryConceptId)}｜${esc(abilityNames[item.ability]||item.ability)}</span><h2>${esc(kpName(item))}</h2></div><span class="stage">${esc(purposeNames[item.purpose]||item.purpose)}</span></div><p class="stem">${math(item.stem)}</p><ol class="options">${(item.options||[]).map(option=>`<li class="${correct.has(option.id)?'correct':''}"><span class="option-id">${esc(option.id)}</span>${math(option.text)}</li>`).join('')}</ol><details><summary>展開答案與解析</summary><p><strong>正確答案：</strong>${esc([...correct].join('、'))}</p><div class="solution">${math(item.explanation||'未附解析')}</div>${Object.keys(item.distractorMap||{}).length?`<p><strong>錯誤選項診斷碼：</strong>${Object.entries(item.distractorMap).map(([id,code])=>`${esc(id)}：${esc(code)}`).join('；')}</p>`:''}</details><p class="meta"><span>題號：${esc(item.itemId)}</span><span>版本：${esc(item.itemVersion)}</span><span>預估：${esc(item.expectedSeconds)} 秒</span><span>狀態：已出版</span></p></article>`}
    let all=[];
    function filter(){const u=document.querySelector('#unit').value,p=document.querySelector('#purpose').value,a=document.querySelector('#ability').value;let shown=0;document.querySelectorAll('.question').forEach(el=>{const visible=(u==='ALL'||el.dataset.unit===u)&&(p==='ALL'||el.dataset.purpose===p)&&(a==='ALL'||el.dataset.ability===a);el.classList.toggle('hidden',!visible);if(visible)shown++});document.querySelector('#count').textContent=`顯示 ${shown}／${all.length} 題`}
    async function load(){try{const entries=await Promise.all(Object.keys(units).map(async id=>{const response=await fetch(`../content/questions/${id}/questions.json`);if(!response.ok)throw new Error(`${units[id].name}題庫載入失敗`);const bank=await response.json();return bank.items.map(item=>({...item,unitId:id}))}));all=entries.flat();document.querySelector('#unit').insertAdjacentHTML('beforeend',Object.entries(units).map(([id,u])=>`<option value="${id}">${u.name}（${u.count} 題）</option>`).join(''));document.querySelector('#metrics').innerHTML=Object.entries(units).map(([id,u])=>`<article class="metric"><strong>${entries[Object.keys(units).indexOf(id)].length}</strong><span>${u.name}</span></article>`).join('');document.querySelector('#questions').innerHTML=all.map(card).join('');document.querySelectorAll('select').forEach(el=>el.addEventListener('change',filter));document.querySelector('#expand').onclick=()=>document.querySelectorAll('.question:not(.hidden) details').forEach(el=>el.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('.question details').forEach(el=>el.open=false);filter()}catch(error){document.querySelector('#questions').innerHTML=`<p class="error">${esc(error.message)}。請使用本機網址 http://127.0.0.1:8770 開啟本頁。</p>`}}
    load();
  </script>
</body>
</html>
