<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200"
     font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',system-ui,sans-serif">
  <title>兩直線上各取一點：u 是兩點的連接向量、v 是直線的方向向量</title>
  <defs>
    <marker id="ar-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ar-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/>
    </marker>
  </defs>

  <!-- 兩條平行直線 -->
  <line x1="20" y1="112" x2="252" y2="29" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="172" x2="290" y2="89" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <text x="258" y="26" font-size="15" fill="#2b2b2b" font-style="italic">L<tspan font-size="11" dy="4">1</tspan></text>
  <text x="296" y="86" font-size="15" fill="#2b2b2b" font-style="italic">L<tspan font-size="11" dy="4">2</tspan></text>

  <!-- 連接兩點的向量 u -->
  <line x1="138" y1="143" x2="158" y2="72" stroke="#c0392b" stroke-width="2.8"
        marker-end="url(#ar-u)"/>
  <circle cx="160" cy="65" r="3.6" fill="#c0392b"/>
  <circle cx="138" cy="143" r="3.6" fill="#c0392b"/>
  <text x="103" y="108" font-size="16" fill="#c0392b" font-style="italic">u</text>
  <text x="103" y="96" font-size="12" fill="#c0392b">→</text>
  <text x="170" y="60" font-size="13" fill="#c0392b" font-style="italic">(x₁, y₁, z₁)</text>
  <text x="44" y="174" font-size="13" fill="#c0392b" font-style="italic">(x₂, y₂, z₂)</text>

  <!-- 直線的方向向量 v -->
  <line x1="138" y1="143" x2="224" y2="112" stroke="#2e7d5b" stroke-width="2.8"
        marker-end="url(#ar-v)"/>
  <text x="232" y="118" font-size="16" fill="#2e7d5b" font-style="italic">v</text>
  <text x="232" y="106" font-size="12" fill="#2e7d5b">→</text>
</svg>
