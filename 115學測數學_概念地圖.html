<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學測數A · 概念地圖（從大考反推）</title>
<style>:root{
    --ink:#2b2b2b; --maroon:#8c2740; --maroon-d:#6f1f33; --rose:#b03a5b;
    --ans:#c0392b; --btn:#1f6f78; --btn-bg:#e9f5f4; --btn-bd:#1f6f78;
    --card:#ffffff; --page:#f7f2ee; --callout:#fdf3ee; --strat:#eef6f1; --line:#e7dcd6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
    line-height:1.85; font-size:16.5px;
  }
  .wrap{max-width:940px; margin:0 auto; padding:0 18px 80px;}
  /* toolbar */
  .toolbar{
    position:sticky; top:0; z-index:50; background:rgba(140,39,64,.97);
    color:#fff; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 18px; margin-bottom:8px; box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .toolbar .t-title{font-weight:700; margin-right:auto; font-size:16px; letter-spacing:.5px}
  .toolbar button{
    background:#fff; color:var(--maroon-d); border:none; border-radius:20px;
    padding:6px 14px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  .toolbar button:hover{background:#ffe6ee}
  .toolbar .nav-select{background:#fff; color:var(--maroon-d); border:none; border-radius:20px; padding:6px 12px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; max-width:44vw}
  .card[id], .part[id]{scroll-margin-top:64px}
  .hero{padding:26px 0 6px; text-align:center}
  .hero h1{color:var(--maroon); margin:.1em 0; font-size:27px; letter-spacing:1px}
  .hero p{margin:.3em 0; color:#7a6a63; font-size:14.5px}
  .legend{
    background:#fff7ef; border:1px dashed #e0b9a6; border-radius:12px;
    padding:10px 16px; margin:14px 0 24px; font-size:14px; color:#6b5249;
  }
  .legend b{color:var(--maroon)}
  /* part heading */
  .part{
    margin:38px 0 16px; padding:10px 18px; border-radius:12px;
    background:linear-gradient(90deg,var(--maroon),#a8395a); color:#fff;
    font-size:21px; font-weight:800; letter-spacing:1px;
    box-shadow:0 3px 12px rgba(140,39,64,.22);
  }
  .part small{display:block; font-weight:500; font-size:13.5px; opacity:.92; letter-spacing:.5px}
  /* card */
  .card{
    background:var(--card); border-radius:14px; padding:20px 22px; margin:18px 0;
    box-shadow:0 2px 10px rgba(80,40,30,.07); border-left:5px solid var(--maroon);
  }
  .kp{color:var(--maroon); font-size:19px; font-weight:800; margin:0 0 4px}
  .kp .num{
    display:inline-block; background:var(--maroon); color:#fff; border-radius:8px;
    padding:1px 9px; font-size:15px; margin-right:8px; vertical-align:middle;
  }
  .callout{background:var(--callout); border-radius:10px; padding:10px 14px; margin:10px 0 16px; font-size:15px; color:#6b4a3f}
  .callout b{color:var(--maroon-d)}
  /* 解題策略：一點一行，▸ 標記，續行懸掛對齊 */
  .callout .sln{display:block; padding-left:1.25em; text-indent:-1.25em}
  .callout .sln+.sln{margin-top:5px}
  .callout .sln::before{content:"▸ "; color:var(--btn); font-weight:800}
  .label{
    display:block; width:fit-content; margin:30px 0 8px; padding:3px 12px; border-radius:6px;
    background:#f3e3e8; color:var(--maroon-d); font-weight:800; font-size:15px;
  }
  ul.points{margin:6px 0; padding-left:6px; list-style:none}
  ul.points>li{
    position:relative; padding:7px 4px 7px 30px; border-bottom:1px dashed var(--line);
  }
  ul.points>li:last-child{border-bottom:none}
  ul.points>li::before{
    counter-increment:pt; content:counter(pt);
    position:absolute; left:0; top:8px; width:21px; height:21px; line-height:21px;
    text-align:center; background:#f0dde3; color:var(--maroon-d); border-radius:50%;
    font-size:12.5px; font-weight:700;
  }
  ul.points{counter-reset:pt}
  .sub{padding-left:6px; color:#555; display:block}
  /* 圖示 */
  ul.points>li.figli{counter-increment:none; padding:4px 0 4px; border-bottom:none}
  ul.points>li.figli::before{content:none}
  figure.tfig{margin:10px auto; text-align:center; max-width:155px; background:#fbfafc;
    border:1px solid var(--line); border-radius:12px; padding:9px 10px 6px}
  figure.tfig svg{display:block; width:100%; height:auto; margin:0 auto}
  figure.tfig figcaption{font-size:13px; color:#5a4a52; margin-top:6px; font-weight:600}
  figure.tfig figcaption b{color:var(--maroon)}
  /* 標籤＋分行內文：一個小概念一行，續行對齊在「：」後 */
  ul.points>li.pt2{display:flex; align-items:baseline; gap:.1em}
  ul.points>li.pt2>.lab{font-weight:800; white-space:nowrap; flex:0 0 auto; color:#3a2b2e}
  ul.points>li.pt2>.body{flex:1 1 auto; min-width:0}
  ul.points>li.pt2>.body>.ln{display:block}
  ul.points>li.pt2>.body>.ln + .ln{margin-top:3px}
  @media(max-width:560px){
    ul.points>li.pt2{flex-direction:column; gap:1px}
    ul.points>li.pt2>.body{padding-left:.7em}
  }
  /* blank (fill-in) */
  .blank{cursor:pointer; user-select:none; display:inline-block; vertical-align:middle}
  .blank .q{
    display:inline-block; min-width:2.6em; text-align:center;
    color:var(--rose); background:#fbeef2; border:1.5px dashed #d6a3b4;
    border-radius:6px; padding:0 .5em; font-weight:700; transition:.12s;
  }
  .blank:hover .q{background:#f6dee6; border-color:var(--rose)}
  .blank .a{display:none; color:var(--ans); font-weight:700; background:#fdecea; border-radius:5px; padding:0 .25em}
  .blank.on .q{display:none}
  .blank.on .a{display:inline}
  /* solution button + block */
  .sol-btn{
    display:inline-block; margin:6px 0; padding:6px 16px; cursor:pointer;
    background:var(--btn-bg); color:var(--btn); border:1.5px solid var(--btn-bd);
    border-radius:20px; font-size:14px; font-weight:700; font-family:inherit; transition:.15s;
  }
  .sol-btn:hover{background:var(--btn); color:#fff}
  .sol-btn.active{background:var(--btn); color:#fff}
  .sol-btn::before{content:"▸ "}
  .sol-btn.active::before{content:"▾ "}
  .sol-btn.mini{padding:3px 12px; font-size:13px; margin:0}
  .sol{display:none; margin:8px 0 4px; padding:12px 16px; background:#f4f8f7;
    border-left:4px solid var(--btn); border-radius:0 8px 8px 0; font-size:15px}
  .sol.open{display:block}
  .sol.inline{border-radius:6px; padding:8px 12px; margin-top:6px}
  .sol p{margin:.4em 0}
  .sol .k{color:var(--btn); font-weight:800}
  .sol .ad{color:var(--ans); font-weight:800}
  /* misconception table */
  .tbl-wrap{overflow-x:auto; margin:6px 0 4px}
  table.mis{border-collapse:collapse; width:100%; min-width:520px; font-size:15px}
  table.mis th{background:#f3e3e8; color:var(--maroon-d); padding:8px 12px; border:1px solid var(--line); width:50%}
  table.mis td{padding:9px 12px; border:1px solid var(--line); vertical-align:top}
  table.mis td.err{background:#fff;color:#7a4a4a}
  table.mis td.cor{background:#fafdfc}
  .x{color:#b9542f; font-weight:700} .o{color:#1f7a4d; font-weight:700}
  /* question */
  .q-meta{font-weight:800; color:var(--maroon-d); margin:3.4em 0 6px; font-size:15.5px}
  .label + .q-meta{margin-top:10px}
  .subq{margin-top:1.8em}
  .q-meta .tag{background:#efe0e5; border-radius:5px; padding:1px 8px; margin-right:6px; font-size:14px}
  .q-meta .lv{color:#c98a00; font-weight:700; margin-left:4px}
  .q-meta .core{display:block; font-weight:600; color:#7a6258; font-size:13.5px; margin-top:2px}
  .q-body{margin:6px 0}
  .opts{margin:10px 0 2px; color:#333}
  .opts > span{display:block; margin:9px 0; line-height:1.9}
  .ctr{text-align:center; margin:10px 0}
  .ex{padding-left:1.6em; color:#444}
  /* diagram */
  .planes{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:14px 0}
  .planes figure{margin:0; flex:1 1 200px; max-width:260px; background:#fbfafc; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
  .planes svg{width:100%; height:120px}
  .planes figcaption{font-size:13.5px; color:#5a4a52; margin-top:6px; font-weight:600}
  .planes figcaption b{color:var(--maroon)}
  /* quick ref */
  table.ref{border-collapse:collapse; width:100%; min-width:560px; font-size:15px}
  table.ref th{background:var(--maroon); color:#fff; padding:8px 12px; border:1px solid #d9b9c4}
  table.ref td{padding:8px 12px; border:1px solid var(--line)}
  table.ref td:first-child{background:#faf2f5; font-weight:700; color:var(--maroon-d); white-space:nowrap; width:30%}
  ol.checklist{font-size:15px; padding-left:1.4em}
  ol.checklist li{padding:4px 0; border-bottom:1px dashed var(--line)}
  .foot{text-align:center; color:#9a8a82; font-size:12.5px; margin-top:30px}
  /* 附註（點按浮動說明） */
  .note{position:relative; cursor:help; border-bottom:1.6px dotted var(--btn); color:#175a62}
  .note::after{content:"ⓘ"; font-size:.72em; vertical-align:super; color:var(--btn); margin-left:1px}
  .note>.np{
    display:none; position:absolute; left:0; top:138%; z-index:60;
    width:max-content; max-width:300px; text-align:left; white-space:normal;
    background:#243b3e; color:#fff; padding:9px 13px; border-radius:9px;
    font-size:13.5px; line-height:1.7; font-weight:400; letter-spacing:.2px;
    box-shadow:0 6px 22px rgba(0,0,0,.28); cursor:auto;
  }
  .note>.np::before{content:""; position:absolute; left:14px; top:-6px;
    border:6px solid transparent; border-bottom-color:#243b3e; border-top:none}
  .note.on>.np{display:block}
  .note>.np .katex{color:#fff}
  @media(max-width:560px){ .note>.np{max-width:74vw} }
  .katex{font-size:1.04em}
  @media(max-width:560px){
    body{font-size:15.5px} .hero h1{font-size:22px} .part{font-size:18px}
    .card{padding:16px 15px}
  }
  /* 1 分鐘自我檢查 */
  .selfcheck{margin:18px 0 4px; border:1.5px solid #e0b94e; background:#fffaef; border-radius:12px; padding:12px 16px}
  .sc-head{font-weight:800; color:#9a6b00; font-size:15px; margin-bottom:7px}
  .sc-q{color:#3a3a3a; font-size:15px; margin-bottom:2px}
  .selfcheck .sol{background:#fff6e0; border-left-color:#e0b94e}
  .selfcheck .sol-btn{background:#fbefce; color:#946700; border-color:#e0b94e}


  .cm-topbar{position:sticky;top:0;z-index:50;background:rgba(140,39,64,.97);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;box-shadow:0 2px 10px rgba(0,0,0,.15);margin-bottom:8px}
  .cm-topbar .t-title{font-weight:800;margin-right:auto;font-size:16px;letter-spacing:.5px}
  .cm-topbar a.home{background:#fff;color:var(--maroon-d);border-radius:20px;padding:5px 14px;font-weight:700;font-size:14px;text-decoration:none}
  .cm-wrap{max-width:1120px;margin:0 auto;padding:0 16px 70px}
  .cm-hero{text-align:center;padding:22px 0 4px}
  .cm-hero h1{color:var(--maroon);font-size:25px;margin:.1em 0;letter-spacing:1px}
  .cm-hero p{color:#7a6a63;font-size:14.5px;margin:.3em auto;max-width:760px}
  .cm-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
  .cm-tabs button{background:#fff;color:var(--maroon-d);border:1.5px solid var(--maroon);border-radius:22px;padding:7px 18px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
  .cm-tabs button.on{background:var(--maroon);color:#fff}
  .cm-view{display:none}
  .cm-view.on{display:block}
  .cm-legend{background:#fff7ef;border:1px dashed #e0b9a6;border-radius:12px;padding:9px 16px;margin:8px 0 12px;font-size:13px;color:#6b5249;line-height:1.9}
  .cm-legend b{color:var(--maroon)}
  .cm-chip{display:inline-flex;align-items:center;gap:4px;margin:0 6px}
  .cm-chip i{width:13px;height:13px;border-radius:3px;display:inline-block}
  .cm-note{display:block;color:#8a7a72;margin-top:2px}
  .cm-board{background:#fffdfb;border:1px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
  .cm-board svg{width:100%;min-width:860px;height:auto;display:block}
  .cm-board a{cursor:pointer}.cm-board a:hover rect{filter:brightness(1.08)}
  .cm-stub{padding:40px;text-align:center;color:#9a857c;font-size:15px}
  .cm-foot{text-align:center;color:#9a8a82;font-size:12.5px;margin-top:26px}
</style></head><body>

<div class="cm-wrap">
<div class="cm-hero"><h1>從大考反推的概念地圖</h1>
