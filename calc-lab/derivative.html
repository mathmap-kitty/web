<html lang="zh-Hant">
<head>

<title>導函數長出來｜選修數學甲（上）互動教具</title>
<meta name="description" content="拖動 x，把每一點的切線斜率描到下圖，導函數 f′ 的圖形自己浮現——導函數是一個函數，不是一個數。">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="lab.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="lab.js"></script>
</head>
<body>
<div class="topbar">
  <a class="tb-title" href="index.html">mathmap 數學教材網<small>選修數學甲（上）互動教具</small></a>
  <a class="ghost" href="index.html">← 教具目錄</a>
  <a class="ghost" href="../">總入口</a>
</div>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>導函數 <span class="thin">長出來</span></h1>
      <p>上圖每一點都有一條切線，斜率是一個數；把「x 在哪、斜率多少」描到下圖，描出來的整條曲線就是導函數 f′。它是一個函數，不是一個數。</p>
    </div>
    <div class="sec"><b>2-1</b> 微分的定義與運算 · 站 3 導函數</div>
  </div>

  <div class="deck">
    <section class="card stage">
      <div class="formula">
        <span id="fHead"></span>
        <span class="eq" style="margin:0 6px">⟶</span>
        <span data-tex="f'(x)=\text{切線斜率，隨 } x \text{ 改變}"></span>
      </div>
      <div class="plotbox" style="aspect-ratio:16/11"><canvas id="plot"></canvas></div>
      <div class="stagefoot">
        <span class="key"><span class="sw-line teal"></span>切線斜率 &gt; 0（上升）</span>
        <span class="key"><span class="sw-line" style="border-top-color:var(--ans)"></span>斜率 &lt; 0（下降）</span>
        <span class="key"><span class="sw-line" style="border-top-color:var(--mut)"></span>斜率 = 0（水平）</span>
        <span class="key"><span class="swatch" style="background:var(--teal)"></span>下圖：描出來的 (x, f′(x))</span>
      </div>
    </section>

    <div class="rail">
      <div class="card">
        <span class="label">函數 f(x)</span>
        <div class="chips" id="fnChips"></div>
      </div>

      <div class="card accent-teal">
        <span class="label teal">自己輸入</span>
        <div id="fnPanel"></div>
      </div>

      <div class="card">
        <div class="nhead">
          <span class="label">目前位置</span>
          <div class="nval"><small>x =</small><span id="xOut">—</span></div>
        </div>
        <input type="range" id="xSlider" min="0" max="1000" value="0" step="1" aria-label="x">
        <button class="btn wide" id="playBtn" type="button"></button>
        <label class="switch" style="margin-top:8px"><input type="checkbox" id="ghost"> 先淡淡畫出整條 f′（對答案用）</label>
      </div>

      <div class="card readout">
        <span class="label">即時數值</span>
        <div class="rows">
          <div class="row"><span class="nm"><span data-tex="f(x)"></span></span><span class="vv" id="vf">—</span></div>
          <div class="row teal"><span class="nm">切線斜率 <span data-tex="f'(x)"></span></span><span class="vv" id="vd">—</span></div>
          <div class="row big"><span class="nm">這一點的 f</span><span class="vv" id="vWord">—</span></div>
        </div>
      </div>

      <div class="note" id="hint"></div>
    </div>
  </div>

  <div class="copyright">mathmap 數學地圖 © Kitty　·　f′(a) 是一個數，f′(x) 是一個函數。</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var PRESETS = [
    { id: "sq",   src: "x^2",    lo: -2,   hi: 2,
      note: "描出來是一條直線 <span data-tex=\"f'(x)=2x\"></span>：左邊斜率負、過 0 之後變正，而且愈往右愈陡。" },
    { id: "cube", src: "x^3-3x", lo: -2.5, hi: 2.5,
      note: "<span data-tex=\"f'(x)=3x^2-3\"></span>。f 的兩個轉折點（x = ±1）就是下圖 f′ 穿過 0 的地方——2-2 會用這個找極值。" },
    { id: "sin",  src: "sin(x)", lo: -3.5, hi: 6.5,
      note: "sin 描出來是 cos：波峰處斜率 0、上升最快處斜率 1。課綱外，但看一次就懂「導函數也是函數」。" },
    { id: "abs",  src: "abs(x)", lo: -2,   hi: 2,
      note: "尖點：左邊斜率一直是 −1、右邊一直是 1，x = 0 那一點描不出來——f′ 在那裡<b>有個洞</b>。" }
  ];
  PRESETS.forEach(function (p) { var F = Lab.parseFn(p.src); p.f = F.f; p.tex = F.tex; p.html = '<span data-tex="' + F.tex.replace(/"/g, "&quot;") + '"></span>'; });
  var state = { F: PRESETS[0], x: 0, ghost: false };
  var P = Lab.pal(), N = 400;

  function build(F) {
    F._xs = []; F._d = []; var lo = Infinity, hi = -Infinity, i, x, d;
    for (i = 0; i <= N; i++) {
      x = F.lo + (F.hi - F.lo) * i / N; d = Lab.d1(F.f, x);
      F._xs.push(x); F._d.push(d);
      if (isFinite(d)) { if (d < lo) lo = d; if (d > hi) hi = d; }
    }
    if (!isFinite(lo)) { lo = -1; hi = 1; }
    F._dlo = Math.min(0, lo); F._dhi = Math.max(0, hi);
  }
  function signColor(d) { return !isFinite(d) ? P.mut : d > 1e-3 ? P.teal : d < -1e-3 ? P.ans : P.mut; }

  var cv = document.getElementById("plot"), ctx = cv.getContext("2d"), W = 0, H = 0;
  function draw() {
    var F = state.F, x = state.x, fx = F.f(x), d = Lab.d1(F.f, x), pad = (F.hi - F.lo) * 0.04;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    var topH = Math.round(H * 0.52);

    var fr = Lab.range(F.f, F.lo, F.hi), fs = (fr[1] - fr[0]) || 1;
    var p = new Lab.Plot(ctx, { x: 0, y: 0, w: W, h: topH, padL: 56, padR: 18, padT: 24, padB: 22 },
      [F.lo - pad, F.hi + pad], [Math.min(0, fr[0]) - fs * 0.12, Math.max(0, fr[1]) + fs * 0.18]);
    p.grid({ xgrid: false, lines: 4 }); p.axes({ ylabel: "y" });
    p.curve(F.f, [F.lo, F.hi], { color: P.maroon, width: 2.6 });
    var col = signColor(d);
    if (isFinite(d)) {
      var L = (F.hi - F.lo) * 0.14;
      p.line(x - L, fx - d * L, x + L, fx + d * L, { color: col, width: 2.6 });
    }
    p.line(x, fx, x, p.ylo, { color: P.mut, width: 1, dash: [3, 3] });
    p.dot(x, fx, { color: P.maroon, r: 5, ring: true });
    p.text(x, fx, isFinite(d) ? "斜率 " + Lab.fmt(d, 2) : "沒有切線", { size: 12.5, weight: 700, color: col, dx: 10, dy: d >= 0 ? 18 : -12 });
    p.textPx(p.x0 + p.w - 8, p.y0 + 4, "f(x)：每一點畫切線、讀斜率", { size: 12.5, color: P.maroonD, weight: 700, align: "right" });

    ctx.strokeStyle = P.line; ctx.beginPath(); ctx.moveTo(12, topH + 0.5); ctx.lineTo(W - 12, topH + 0.5); ctx.stroke();
    var ds = (F._dhi - F._dlo) || 1;
    var q = new Lab.Plot(ctx, { x: 0, y: topH, w: W, h: H - topH, padL: 56, padR: 18, padT: 24, padB: 34 },
      [F.lo - pad, F.hi + pad], [F._dlo - ds * 0.15, F._dhi + ds * 0.2]);
    q.grid({ xgrid: false, lines: 4 }); q.axes({ ylabel: "f′(x)" });
    if (state.ghost) q.poly(F._xs, F._d, { color: P.teal, width: 1.6, dash: [5, 4], alpha: 0.35 });
    var upto = Math.floor((x - F.lo) / (F.hi - F.lo) * N);
    q.poly(F._xs, F._d, { color: P.teal, width: 2.8 }, upto);
    q.line(x, q.yhi, x, 0, { color: P.mut, width: 1, dash: [3, 3] });
    if (isFinite(d)) q.dot(x, d, { color: P.teal, r: 5.5, ring: true });
    else { ctx.strokeStyle = P.ans; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.X(x), q.Y(0), 5, 0, 6.2832); ctx.stroke(); }
    q.tick(x, "x", { color: P.teal, bold: true });
    q.textPx(q.x0 + q.w - 8, q.y0 + 4, "f′(x)：把斜率描下來", { size: 12.5, color: P.teal, weight: 700, align: "right" });

    document.getElementById("xOut").textContent = Lab.fmt(x, 2);
    document.getElementById("vf").textContent = Lab.fmt(fx, 4);
    document.getElementById("vd").textContent = isFinite(d) ? Lab.fmt(d, 4) : "不存在";
    var w = document.getElementById("vWord");
    w.textContent = !isFinite(d) ? "尖點，不可微" : d > 1e-3 ? "上升 ↗" : d < -1e-3 ? "下降 ↘" : "水平 →";
    w.style.color = col;
  }

  var xs = document.getElementById("xSlider"), hint = document.getElementById("hint");
  function setX(v, sync) { state.x = Math.max(state.F.lo, Math.min(state.F.hi, v)); if (sync) xs.value = Math.round((state.x - state.F.lo) / (state.F.hi - state.F.lo) * 1000); draw(); }
  function setF(F) {
    state.F = F; build(F);
    Lab.katex(document.getElementById("fHead"), "f(x)=" + F.tex);
    hint.innerHTML = F.note; Lab.katexAll(hint);
    setX(F.lo + (F.hi - F.lo) * 0.25, true);
  }
  xs.addEventListener("input", function () { player.stop(); setX(state.F.lo + (state.F.hi - state.F.lo) * (+xs.value) / 1000, false); });
  document.getElementById("ghost").addEventListener("change", function (ev) { state.ghost = ev.target.checked; draw(); });
  var fnChips = Lab.chips(document.getElementById("fnChips"), PRESETS, state.F.id, function (it) { player.stop(); panel.fill({ src: it.src, a: it.lo, b: it.hi }); setF(it); });
  Lab.katexAll(document.getElementById("fnChips"));
  var panel = Lab.fnPanel(document.getElementById("fnPanel"), {
    varName: "x", intLabel: "顯示範圍",
    hint: '例：<code>x^2-2x</code>、<code>x^4-2x^2</code>、<code>cos(x)</code>、<code>abs(x-1)</code>',
    onApply: function (F) { player.stop(); F.lo = F.a; F.hi = F.b; F.note = "<b>自訂函數</b>：先猜 f′ 長什麼樣子，再按播放對答案。"; fnChips.select(null); setF(F); }
  });
  panel.fill({ src: PRESETS[0].src, a: PRESETS[0].lo, b: PRESETS[0].hi });
  var player = Lab.player(document.getElementById("playBtn"), {
    play: "▶　從左掃到右", pause: "❚❚　暫停", ms: 40,
    onStart: function () { if (state.x >= state.F.hi - 1e-9) setX(state.F.lo, true); },
    tick: function () { var s = (state.F.hi - state.F.lo) / 160; if (state.x + s >= state.F.hi) { setX(state.F.hi, true); return false; } setX(state.x + s, true); return true; }
  });
  function relayout() { var a = Lab.fit(cv); W = a[0]; H = a[1]; draw(); }
  window.addEventListener("resize", relayout);
  Lab.katexAll(document); setF(PRESETS[0]); relayout();
});
</script>
</body>
</html>
